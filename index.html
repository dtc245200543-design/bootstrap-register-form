
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
            min-height: 100vh;
        }

        .register-card {
            max-width: 600px;
            width: 100%;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .register-title {
            color: #0d6efd;
            font-weight: bold;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-register {
            padding: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="register-card mx-auto p-4 p-md-5">

            <!-- Tiêu đề -->
            <div class="text-center mb-4">
                <h1 class="register-title h2">Đăng ký tài khoản</h1>
                <p class="text-muted">
                    Vui lòng điền đầy đủ thông tin bên dưới
                </p>
            </div>

            <!-- Form đăng ký -->
            <form id="registerForm">

                <!-- Họ và tên -->
                <div class="mb-3">
                    <label for="fullname" class="form-label">
                        Họ và tên
                    </label>
                    <input type="text" class="form-control"
                           id="fullname" name="fullname"
                           placeholder="Nhập họ và tên"
                           autocomplete="name" required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control"
                           id="email" name="email"
                           placeholder="example@gmail.com"
                           autocomplete="email" required>
                </div>

                <!-- Mật khẩu -->
                <div class="mb-3">
                    <label for="password" class="form-label">
                        Mật khẩu
                    </label>
                    <input type="password" class="form-control"
                           id="password" name="password"
                           placeholder="Nhập mật khẩu"
                           autocomplete="new-password"
                           minlength="8" required>
                    <div class="form-text text-muted">
                        Mật khẩu phải có ít nhất 8 ký tự.
                    </div>
                </div>

                <!-- Xác nhận mật khẩu -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        Xác nhận mật khẩu
                    </label>
                    <input type="password" class="form-control"
                           id="confirmPassword" name="confirmPassword"
                           placeholder="Nhập lại mật khẩu"
                           autocomplete="new-password" required>
                    <div id="passwordMessage" class="form-text"></div>
                </div>

                <!-- Giới tính -->
                <div class="mb-3">
                    <label class="form-label d-block">Giới tính</label>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio"
                               name="gender" id="male"
                               value="Nam" required>
                        <label class="form-check-label" for="male">
                            Nam
                        </label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio"
                               name="gender" id="female"
                               value="Nữ">
                        <label class="form-check-label" for="female">
                            Nữ
                        </label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio"
                               name="gender" id="other"
                               value="Khác">
                        <label class="form-check-label" for="other">
                            Khác
                        </label>
                    </div>
                </div>

                <!-- Sở thích -->
                <div class="mb-3">
                    <label class="form-label d-block">Sở thích</label>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox"
                               id="music" name="hobbies" value="Âm nhạc">
                        <label class="form-check-label" for="music">
                            Âm nhạc
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox"
                               id="sports" name="hobbies" value="Thể thao">
                        <label class="form-check-label" for="sports">
                            Thể thao
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox"
                               id="travel" name="hobbies" value="Du lịch">
                        <label class="form-check-label" for="travel">
                            Du lịch
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox"
                               id="technology" name="hobbies" value="Công nghệ">
                        <label class="form-check-label" for="technology">
                            Công nghệ
                        </label>
                    </div>
                </div>

                <!-- Quốc gia -->
                <div class="mb-4">
                    <label for="country" class="form-label">
                        Quốc gia
                    </label>

                    <select class="form-select" id="country"
                            name="country" required>
                        <option value="" selected disabled>
                            -- Chọn quốc gia --
                        </option>
                        <option value="Việt Nam">Việt Nam</option>
                        <option value="Nhật Bản">Nhật Bản</option>
                        <option value="Hàn Quốc">Hàn Quốc</option>
                        <option value="Singapore">Singapore</option>
                        <option value="Thái Lan">Thái Lan</option>
                        <option value="Hoa Kỳ">Hoa Kỳ</option>
                    </select>
                </div>

                <!-- Nút Submit -->
                <button type="submit"
                        class="btn btn-primary w-100 btn-register">
                    Đăng ký
                </button>

                <p id="successMessage"
                   class="text-success text-center mt-3 mb-0"
                   role="status" aria-live="polite"></p>

                <p class="text-muted text-center mt-4 mb-0">
                    Đã có tài khoản?
                    <a href="#" id="loginLink">Đăng nhập</a>
                </p>

            </form>
        </div>
    </div>

    <!-- JavaScript kiểm tra form -->
    <script>
        const form = document.getElementById("registerForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const passwordMessage = document.getElementById("passwordMessage");
        const successMessage = document.getElementById("successMessage");

        function checkPassword() {
            if (confirmPassword.value === "") {
                confirmPassword.setCustomValidity("");
                passwordMessage.textContent = "";
                return;
            }

            if (password.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity(
                    "Mật khẩu xác nhận không khớp."
                );
                passwordMessage.textContent =
                    "Mật khẩu xác nhận không khớp.";
                passwordMessage.className = "form-text text-danger";
            } else {
                confirmPassword.setCustomValidity("");
                passwordMessage.textContent = "Mật khẩu khớp.";
                passwordMessage.className = "form-text text-success";
            }
        }

        password.addEventListener("input", checkPassword);
        confirmPassword.addEventListener("input", checkPassword);

        form.addEventListener("submit", function(event) {
            event.preventDefault();
            checkPassword();

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            successMessage.textContent =
                "Đăng ký thành công! Đây là bản demo giao diện.";
        });

        document.getElementById("loginLink").addEventListener(
            "click", function(event) {
                event.preventDefault();
                alert("Đây là liên kết minh họa cho chức năng đăng nhập.");
            }
        );
    </script>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
